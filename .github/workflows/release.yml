name: Release Windows x64

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run dist

      - name: Create release archive
        shell: pwsh
        run: |
          $asset = "MythraDesktopPet-$env:GITHUB_REF_NAME-win32-x64.zip"
          tar.exe -a -cf $asset -C dist MythraDesktopPet-win32-x64
          "RELEASE_ASSET=$asset" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          @'
          ## Mythra Desktop Pet v0.2.7

          Windows x64 portable build with adventure progression, dungeon battles and AI equipment icons.

          - Full idle/action animations for original and new outfits
          - Outfit change and revert animations, new-outfit v2 persona switching
          - Adjustable pet scale slider and draggable settings / voice / adventure panels
          - Middle-click the pet to open the adventure handbook
          - Level, gold economy, shop, equipment inventory and five rarity tiers
          - Dungeons with running animation, scrolling background, enemy encounters and sword attacks
          - Enemy HP scales with attack power; bosses have a low rare-equipment drop chance
          - AI-generated thumbnails for all 15 equipment icons
          - Satiety, mood and energy agent with persona behavior and voice integration

          Download `MythraDesktopPet-v0.2.7-win32-x64.zip`, extract the whole folder and run `MythraDesktopPet.exe`.
          '@ | Out-File -FilePath release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $env:RELEASE_ASSET --title "Mythra Desktop Pet v0.2.7" --notes-file release-notes.md --verify-tag
